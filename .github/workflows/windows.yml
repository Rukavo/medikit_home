name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install Windows workload
        run: dotnet workload install maui-windows
      - name: Build and package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/HomePharma/HomePharma.csproj)).Project.PropertyGroup.ApplicationDisplayVersion | Where-Object { $_ }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag and project version differ.' }
          ./tools/Build-Release.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: MedikitHome-Windows
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MedikitHome-Windows
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; keeping its published assets unchanged."
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Medikit Home $GITHUB_REF_NAME · Windows" --notes-file RELEASE_NOTES.md
          fi
